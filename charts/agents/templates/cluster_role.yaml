apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-creator
rules:
- apiGroups: ["batch", "extensions"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# The agent creates the per-identity state PVC mounted by the policy gateway.
# Scoped per steward namespace through the RoleBindings below; deliberately no
# delete/update - the agent only ever gets or creates the claim.
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "create"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-creator-uva
  namespace: uva
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-creator-vu
  namespace: vu

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-uva
  namespace: uva
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-creator
subjects:
- kind: ServiceAccount
  name: job-creator-uva
  namespace: uva

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-vu
  namespace: vu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-creator
subjects:
- kind: ServiceAccount
  name: job-creator-vu
  namespace: vu
---

